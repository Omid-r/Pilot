name: Build Pilot Snapshot Offline RHEL
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - pilot-production-rebuild-20261003
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APP_ROOT: extracted/snapshot-2026-10-03
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify snapshot
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          test -f package.json
          test -f server.ts
          test -f index.html
          test -f offline-prereqs/README.md
          node -e "console.log(require('./package.json').name, require('./package.json').version)"

      - name: Install dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Stage all offline RHEL user-space prerequisites
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p offline-prereqs/rhel8/x86_64/rpms
          mkdir -p offline-prereqs/rhel8/x86_64/bin
          mkdir -p offline-prereqs/rhel9/x86_64/rpms
          mkdir -p offline-prereqs/rhel9/x86_64/bin

          PACKAGES="curl openssl openssh-clients iproute iputils gawk sed grep findutils coreutils util-linux hostname which nmap-ncat lsof tar gzip ca-certificates firewalld iptables policycoreutils policycoreutils-python-utils python3 rsync procps-ng podman"

          docker run --rm \
            -e "PACKAGES=${PACKAGES}" \
            -v "${PWD}/offline-prereqs/rhel8/x86_64/rpms:/out" \
            rockylinux:8 bash -lc 'set -euo pipefail; dnf -y install dnf-plugins-core; dnf download --resolve --alldeps --destdir /out ${PACKAGES}'

          docker run --rm \
            -e "PACKAGES=${PACKAGES}" \
            -v "${PWD}/offline-prereqs/rhel9/x86_64/rpms:/out" \
            rockylinux:9 bash -lc 'set -euo pipefail; dnf -y install dnf-plugins-core; dnf download --resolve --alldeps --destdir /out ${PACKAGES}'

          KUBECTL_VERSION="v1.37.1"
          KUBECTL_URL="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          KUBECTL_SHA_URL="${KUBECTL_URL}.sha256"

          for rhel in 8 9; do
            curl -fL "${KUBECTL_URL}" -o "offline-prereqs/rhel${rhel}/x86_64/bin/kubectl"
            curl -fL "${KUBECTL_SHA_URL}" -o "offline-prereqs/rhel${rhel}/x86_64/bin/kubectl.sha256"
            (
              cd "offline-prereqs/rhel${rhel}/x86_64/bin"
              sha256sum -c kubectl.sha256
            )
            chmod 0755 "offline-prereqs/rhel${rhel}/x86_64/bin/kubectl"
          done

      - name: TypeScript check
        working-directory: ${{ env.APP_ROOT }}
        run: npm run lint

      - name: Production build
        working-directory: ${{ env.APP_ROOT }}
        run: npm run build

      - name: Real runtime smoke test
        working-directory: ${{ env.APP_ROOT }}
        run: npm run smoke

      - name: Verify packaged output
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/server.cjs
          test -d offline-prereqs/rhel8/x86_64/rpms
          test -d offline-prereqs/rhel9/x86_64/rpms
          test "$(find offline-prereqs/rhel8/x86_64/rpms -maxdepth 1 -type f -name '*.rpm' | wc -l)" -gt 0
          test "$(find offline-prereqs/rhel9/x86_64/rpms -maxdepth 1 -type f -name '*.rpm' | wc -l)" -gt 0
          test -x offline-prereqs/rhel8/x86_64/bin/kubectl
          test -x offline-prereqs/rhel9/x86_64/bin/kubectl

      - name: Build final self-contained RHEL tarball
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/splunk-doctor
          cp -a dist scripts package.json README.md metadata.json offline-prereqs release/splunk-doctor/
          cp -a node_modules release/splunk-doctor/
          mkdir -p release/splunk-doctor/node-runtime/bin
          cp "$(command -v node)" release/splunk-doctor/node-runtime/bin/node
          chmod 0755 release/splunk-doctor/node-runtime/bin/node
          rm -f release/splunk-doctor/data/security-db.json
          rm -f release/splunk-doctor/data/master-signing.key
          rm -f release/splunk-doctor/data/bootstrap-admin-password
          chmod -R u=rwX,go=rX release/splunk-doctor
          tar -czf release/splunk-doctor-offline-rhel-1.5.0.tar.gz -C release splunk-doctor
          sha256sum release/splunk-doctor-offline-rhel-1.5.0.tar.gz > release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256

      - name: Inspect final bundle
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          sha256sum -c release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
          tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -E 'splunk-doctor/(dist/server.cjs|dist/index.html|scripts/setup.sh|scripts/install-offline-prereqs.sh|node-runtime/bin/node)$'
          tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -q 'splunk-doctor/offline-prereqs/rhel8/x86_64/rpms/.*\.rpm$'
          tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -q 'splunk-doctor/offline-prereqs/rhel9/x86_64/rpms/.*\.rpm$'
          tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -q 'splunk-doctor/offline-prereqs/rhel9/x86_64/bin/kubectl$'
          if tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -Eq '(security-db\.json|master-signing\.key|bootstrap-admin-password)$'; then
            echo "Runtime secrets leaked into release bundle."
            exit 1
          fi
          TMP_VALIDATE="$(mktemp -d)"
          tar -xzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz -C "${TMP_VALIDATE}" \
            splunk-doctor/offline-prereqs/rhel9/x86_64/bin/kubectl \
            splunk-doctor/offline-prereqs/rhel9/x86_64/bin/kubectl.sha256
          (
            cd "${TMP_VALIDATE}/splunk-doctor/offline-prereqs/rhel9/x86_64/bin"
            sha256sum -c kubectl.sha256
          )
          rm -rf "${TMP_VALIDATE}"

      - name: Upload offline RHEL release
        uses: actions/upload-artifact@v6
        with:
          name: pilot-snapshot-2026-10-03-offline-rhel-1.5.0
          path: |
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.0.tar.gz
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
          if-no-files-found: error
