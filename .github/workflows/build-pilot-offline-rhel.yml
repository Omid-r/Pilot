name: Build Pilot Snapshot Offline RHEL
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - pilot-production-rebuild-20261003
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APP_ROOT: extracted/snapshot-2026-10-03
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify snapshot
        working-directory: ${{ env.APP_ROOT }}
        run: |
          test -f package.json
          test -f server.ts
          test -f index.html
          node -e "console.log(require('./package.json').name, require('./package.json').version)"
      - name: Install dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Parse diagnostics
        id: parse_diagnostics
        continue-on-error: true
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/pilot-tsc.txt 2>&1
          status=$?
          cat /tmp/pilot-tsc.txt
          echo "tsc exit code: $status"
          exit $status

      - name: Diagnose and repair TypeScript syntax
        if: steps.parse_diagnostics.outcome == 'failure'
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path("server.ts")
          original = path.read_text()
          tsc = Path("node_modules/.bin/tsc")

          def run_tsc():
              p = subprocess.run([str(tsc), "--noEmit", "--pretty", "false"], text=True, capture_output=True)
              return p.returncode, (p.stdout or "") + (p.stderr or "")

          def syntax_diagnostics(output):
              result = []
              for line in output.splitlines():
                  m = re.search(r"server\.ts\((\d+),(\d+)\): error TS(\d+):", line)
                  if not m:
                      continue
                  code = int(m.group(3))
                  if 1000 <= code < 2000:
                      result.append((int(m.group(1)), int(m.group(2)), code, line))
              return result

          _, initial_output = run_tsc()
          initial = syntax_diagnostics(initial_output)
          print("Initial TypeScript diagnostics:")
          print(initial_output)
          if not initial:
              print("No syntax diagnostics detected; continuing to full TypeScript check.")
              raise SystemExit(0)

          lines = original.splitlines()
          candidate_indexes = set()
          for line_no, _, _, _ in initial:
              center = line_no - 1
              for idx in range(max(0, center - 20), min(len(lines), center + 21)):
                  if re.fullmatch(r"\s*\}\s*\)?;?\s*", lines[idx]):
                      candidate_indexes.add(idx)

          accepted = None
          for idx in sorted(candidate_indexes):
              candidate = lines[:idx] + lines[idx+1:]
              path.write_text("\n".join(candidate).rstrip() + "\n")
              _, output = run_tsc()
              remaining = syntax_diagnostics(output)
              print(f"Candidate removing server.ts line {idx+1}: syntax_errors={len(remaining)}")
              if not remaining:
                  accepted = idx
                  break

          if accepted is None:
              path.write_text(original)
              raise SystemExit("No single-line brace repair removed all syntax diagnostics.")

          print(f"Accepted parser repair: removed server.ts line {accepted + 1}: {lines[accepted]!r}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- server.ts; then
            git add server.ts
            git commit -m "fix(server): repair snapshot TypeScript syntax"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: TypeScript check
        working-directory: ${{ env.APP_ROOT }}
        run: npm run lint
      - name: Production build
        working-directory: ${{ env.APP_ROOT }}
        run: npm run build
      - name: Real runtime smoke test
        working-directory: ${{ env.APP_ROOT }}
        run: npm run smoke
      - name: Verify packaged output
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/server.cjs
      - name: Build final self-contained RHEL tarball
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p release/splunk-doctor
          cp -a dist scripts package.json README.md metadata.json release/splunk-doctor/
          cp -a node_modules release/splunk-doctor/ 2>/dev/null || true
          mkdir -p release/splunk-doctor/node-runtime/bin
          cp "$(command -v node)" release/splunk-doctor/node-runtime/bin/node
          chmod 755 release/splunk-doctor/node-runtime/bin/node
          rm -f release/splunk-doctor/data/security-db.json release/splunk-doctor/data/master-signing.key
          chmod -R u=rwX,go=rX release/splunk-doctor
          tar -czf release/splunk-doctor-offline-rhel-1.5.0.tar.gz -C release splunk-doctor
          sha256sum release/splunk-doctor-offline-rhel-1.5.0.tar.gz > release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
      - name: Inspect final bundle
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          sha256sum -c release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
          tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -E 'splunk-doctor/(dist/server.cjs|dist/index.html|scripts/setup.sh|node-runtime/bin/node)$'
          if tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -Eq '(security-db\.json|master-signing\.key)$'; then exit 1; fi
      - name: Upload offline RHEL release
        uses: actions/upload-artifact@v6
        with:
          name: pilot-snapshot-2026-10-03-offline-rhel-1.5.0
          path: |
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.0.tar.gz
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
          if-no-files-found: error
