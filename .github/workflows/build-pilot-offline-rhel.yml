name: Build Pilot Snapshot Offline RHEL

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - pilot-production-rebuild-20261003
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APP_ROOT: extracted/snapshot-2026-10-03
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify snapshot
        working-directory: ${{ env.APP_ROOT }}
        run: |
          test -f package.json
          test -f server.ts
          test -f index.html
          node -e "console.log(require('./package.json').name, require('./package.json').version)"
      - name: Install dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Parse diagnostics
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          node <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const file = 'server.ts';
          const text = fs.readFileSync(file, 'utf8');
          const sf = ts.createSourceFile(file, text, 99, true);
          const ds = sf.parseDiagnostics || [];
          const lines = text.split(/\r?\n/);
          for (const d of ds) {
            const lc = sf.getLineAndCharacterOfPosition(d.start ?? 0);
            const msg = ts.flattenDiagnosticMessageText(d.messageText, '\n');
            console.log(`DIAG ${lc.line+1}:${lc.character+1} ${msg}`);
            for (let n=Math.max(0,lc.line-3); n<=Math.min(lines.length-1,lc.line+3); n++) console.log(`${n+1}: ${lines[n]}`);
          }
          console.log('EOF line count:', lines.length);
          if (ds.length) process.exitCode = 1;
          NODE
      - name: Diagnose and repair TypeScript syntax
        if: failure()
        working-directory: ${{ env.APP_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const p = 'server.ts';
          const original = fs.readFileSync(p, 'utf8');
          const diagnostics = (text) => {
            const sf = ts.createSourceFile(p, text, 99, true);
            return sf.parseDiagnostics || [];
          };
          const lines = original.split(/\r?\n/);
          const initial = diagnostics(original);
          if (!initial.length) {
            console.log('No parser diagnostics; nothing to repair.');
            process.exit(0);
          }
          console.log('Initial parser diagnostics:');
          for (const d of initial) {
            const lc = ts.createSourceFile(p, original, 99, true).getLineAndCharacterOfPosition(d.start ?? 0);
            console.log(`  ${lc.line + 1}:${lc.character + 1} ${ts.flattenDiagnosticMessageText(d.messageText, ' ')}`);
          }
          const candidates = [];
          const seen = new Set();
          for (const d of initial) {
            const sf = ts.createSourceFile(p, original, 99, true);
            const line = sf.getLineAndCharacterOfPosition(d.start ?? 0).line;
            for (let delta = -12; delta <= 12; delta++) {
              const idx = line + delta;
              if (idx < 0 || idx >= lines.length) continue;
              if (!/^\s*\}\s*\)?;?\s*$/.test(lines[idx])) continue;
              const candidate = lines.slice(0, idx).concat(lines.slice(idx + 1)).join('\n');
              if (!seen.has(candidate)) { seen.add(candidate); candidates.push({idx: idx + 1, candidate}); }
            }
          }
          let accepted = null;
          for (const item of candidates) {
            const ds = diagnostics(item.candidate);
            if (!ds.length) { accepted = item; break; }
          }
          if (!accepted) {
            fs.writeFileSync('/tmp/ts-parse-diagnostics.txt', initial.map(d => ts.flattenDiagnosticMessageText(d.messageText, ' ')).join('\n'));
            throw new Error('No bounded single-brace parser repair candidate succeeded');
          }
          fs.writeFileSync(p, accepted.candidate.endsWith('\n') ? accepted.candidate : accepted.candidate + '\n');
          console.log(`Accepted parser-only repair: removed server.ts line ${accepted.idx}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- server.ts; then
            git add server.ts
            git commit -m "fix(server): repair snapshot TypeScript syntax"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: TypeScript check
        working-directory: ${{ env.APP_ROOT }}
        run: npm run lint
      - name: Production build
        working-directory: ${{ env.APP_ROOT }}
        run: npm run build
      - name: Real runtime smoke test
        working-directory: ${{ env.APP_ROOT }}
        run: npm run smoke
      - name: Verify packaged output
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/server.cjs
      - name: Build final self-contained RHEL tarball
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p release/splunk-doctor
          cp -a dist scripts package.json README.md metadata.json release/splunk-doctor/
          cp -a node_modules release/splunk-doctor/ 2>/dev/null || true
          mkdir -p release/splunk-doctor/node-runtime/bin
          cp "$(command -v node)" release/splunk-doctor/node-runtime/bin/node
          chmod 755 release/splunk-doctor/node-runtime/bin/node
          rm -f release/splunk-doctor/data/security-db.json release/splunk-doctor/data/master-signing.key
          chmod -R u=rwX,go=rX release/splunk-doctor
          tar -czf release/splunk-doctor-offline-rhel-1.5.0.tar.gz -C release splunk-doctor
          sha256sum release/splunk-doctor-offline-rhel-1.5.0.tar.gz > release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
      - name: Inspect final bundle
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          sha256sum -c release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
          tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -E 'splunk-doctor/(dist/server.cjs|dist/index.html|scripts/setup.sh|node-runtime/bin/node)$'
          if tar -tzf release/splunk-doctor-offline-rhel-1.5.0.tar.gz | grep -Eq '(security-db\.json|master-signing\.key)$'; then exit 1; fi
      - name: Upload offline RHEL release
        uses: actions/upload-artifact@v6
        with:
          name: pilot-snapshot-2026-10-03-offline-rhel-1.5.0
          path: |
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.0.tar.gz
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.0.tar.gz.sha256
          if-no-files-found: error
