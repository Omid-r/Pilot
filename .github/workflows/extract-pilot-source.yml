name: extract-pilot-source

on:
  push:
    branches:
      - audit/extract-and-verify-2026-10-03
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[bot] extract') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate and extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP" || { echo "No ZIP found in repository root"; exit 1; }

          # Discard any unpushed/generated commit from a previous attempt.
          # This keeps a secret-containing failed local commit out of the next push.
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          rm -rf /tmp/pilot-unpack pilot-source
          mkdir -p /tmp/pilot-unpack pilot-source
          unzip -q "$ZIP" -d /tmp/pilot-unpack

          shopt -s dotglob nullglob
          roots=(/tmp/pilot-unpack/*)
          if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
            cp -a "${roots[0]}/." pilot-source/
          else
            cp -a /tmp/pilot-unpack/. pilot-source/
          fi

          # Normalize source text to UTF-8 before commit. The uploaded ZIP contains
          # CP1256-encoded Persian source (notably src/App.tsx), which TypeScript may
          # tolerate while Vite/Rolldown rejects as invalid UTF-8.
          if [ -f pilot-source/src/App.tsx ]; then
            if ! iconv -f UTF-8 -t UTF-8 pilot-source/src/App.tsx >/dev/null 2>&1; then
              iconv -f CP1256 -t UTF-8 pilot-source/src/App.tsx > /tmp/App.tsx.utf8
              mv /tmp/App.tsx.utf8 pilot-source/src/App.tsx
            fi
          fi
          while IFS= read -r -d '' f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              enc="$(file -bi "$f" | sed -n 's/.*charset=//p' | tr '[:upper:]' '[:lower:]')"
              case "$enc" in
                windows-1256|cp1256) iconv -f CP1256 -t UTF-8 "$f" > /tmp/pilot.utf8 && mv /tmp/pilot.utf8 "$f" ;;
                windows-1252|cp1252) iconv -f CP1252 -t UTF-8 "$f" > /tmp/pilot.utf8 && mv /tmp/pilot.utf8 "$f" ;;
                iso-8859-1) iconv -f ISO-8859-1 -t UTF-8 "$f" > /tmp/pilot.utf8 && mv /tmp/pilot.utf8 "$f" ;;
                *) echo "Unsupported text encoding: $f ($enc)"; exit 1 ;;
              esac
            fi
          done < <(find pilot-source -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.css' -o -name '*.json' -o -name '*.html' \) -print0)
          # Remove embedded credentials/secrets from extracted source before committing it.
          # These values are treated as compromised and must be rotated outside the repository.
          python3 - <<'PY'
          from pathlib import Path
          import re
          replacements = [
              (re.compile(r'https?://hooks[.]slack[.]com'), 'https://slack-webhook.example'),
              (re.compile(r'https?:\\/\\/hooks[.]slack[.]com'), 'https://slack-webhook.example'),
              (re.compile(r'sk-[A-Za-z0-9_-]{20,}'), '${OPENAI_API_KEY}'),
              (re.compile(r'AIza[0-9A-Za-z_-]{20,}'), '${GOOGLE_API_KEY}'),
          ]
          for p in Path("pilot-source").rglob("*"):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for pattern, replacement in replacements:
                  s = pattern.sub(replacement, s)
              p.write_text(s, encoding="utf-8")
          PY
          if grep -RInE 'hooks[.]slack[.]com|hooks\\/slack[.]com|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}' pilot-source; then
            echo "Potential embedded secret remains after sanitization"
            exit 1
          fi
          rm -rf pilot-source/__MACOSX
          find pilot-source -type f -name '.DS_Store' -delete

          echo "=== Extracted tree ==="
          find pilot-source -maxdepth 3 -type f -printf '%P\n' | sort | head -500

          echo "=== Package/build candidates ==="
          find pilot-source -type f \( -name 'package.json' -o -name 'package-lock.json' -o -name 'npm-shrinkwrap.json' -o -name 'pnpm-lock.yaml' -o -name 'yarn.lock' -o -name 'bun.lock' -o -name 'vite.config.*' -o -name 'tsconfig.json' -o -name 'Dockerfile' -o -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' \) -print | sort

          {
            echo "# Pilot extracted source"
            echo
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Original ZIP: \`$(basename "$ZIP")\`"
            echo
            echo "## File inventory"
            echo
            echo "\`\`\`text"
            find pilot-source -type f -printf '%P\t%s bytes\n' | sort
            echo "\`\`\`"
          } > PILOT_SOURCE_MANIFEST.md

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot-source PILOT_SOURCE_MANIFEST.md
          git commit -m "[bot] extract Pilot source for audit"
          git push origin "HEAD:$GITHUB_REF_NAME"
