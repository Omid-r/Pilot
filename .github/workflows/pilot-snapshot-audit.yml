name: pilot-snapshot-audit

on:
  push:
    branches:
      - audit/extract-and-verify-2026-10-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: pilot-source
        run: npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock

      - name: Verify text encodings
        working-directory: pilot-source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== App.tsx encoding ==="
          file -bi src/App.tsx
          python3 - <<'PY'
          from pathlib import Path
          b=Path("src/App.tsx").read_bytes()
          for enc in ("utf-8","utf-16","utf-16-le","utf-16-be","cp1252","cp1256","iso-8859-1"):
              try:
                  s=b.decode(enc)
                  print(enc, "OK", "chars=", len(s), "nul=", s.count("\x00"), "head=", repr(s[:80]))
              except Exception as e:
                  print(enc, "FAIL", type(e).__name__, str(e))
          PY

      - name: TypeScript check
        working-directory: pilot-source
        run: npm run lint

      - name: Verify all text encodings
        working-directory: pilot-source
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            case "$f" in
              node_modules/*|dist/*) continue ;;
            esac
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "INVALID_UTF8: $f"
              file -bi "$f" || true
              python3 - "$f" <<'PY'
          import sys
          p=sys.argv[1]
          b=open(p,'rb').read()
          bad=[]
          i=0
          while i < len(b):
              try:
                  n=1
                  while i+n <= len(b):
                      b[i:i+n].decode('utf-8')
                      break
                  else:
                      n=1
              except UnicodeDecodeError:
                  bad.append(i)
                  n=1
              i += n
          print("FIRST_BYTE_POSITIONS:", bad[:30])
          PY
              bad=1
            fi
          done < <(find . -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.css' -o -name '*.json' -o -name '*.html' \) -print0)
          test "$bad" -eq 0

      - name: Production build
        working-directory: pilot-source
        run: npm run build

      - name: Static truthfulness/security scan
        working-directory: pilot-source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== risky fixed credentials ==="
          grep -RInE "changeme|Splunk@Doctor2026|Splunk@Engineer2026|Splunk@Operator2026|Splunk@Auditor2026|password[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]" .             --exclude-dir=node_modules --exclude-dir=dist || true
          echo "=== embedded Slack/API secret patterns ==="
          if grep -RInE "hooks[.]slack[.]com/services/|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}" .             --exclude-dir=node_modules --exclude-dir=dist; then
            echo "Potential embedded secret-like material found"
            exit 1
          fi
          echo "=== synthetic success / sandbox markers ==="
          grep -RInE "Sandbox Mode|sandboxed[[:space:]]*:[[:space:]]*true|success[[:space:]]*:[[:space:]]*true" server src scripts             --exclude-dir=node_modules --exclude='*.map' | head -250 || true
          echo "=== executable inventory ==="
          find scripts -maxdepth 1 -type f -printf '%f\n' | sort
