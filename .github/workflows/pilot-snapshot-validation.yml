name: pilot-snapshot-validation

on:
  push:
    branches: [fix/pilot-20261003-smoke-real]
    paths:
      - 'extracted/snapshot-2026-10-03/**'
      - '.github/workflows/pilot-snapshot-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Stage portable Node 24 runtime for RHEL bundle
        env:
          NODE_VERSION: '24.21.0'
        shell: bash
        run: |
          set -euo pipefail
          NAME="node-v${NODE_VERSION}-linux-x64"
          BASE="https://nodejs.org/dist/v${NODE_VERSION}"
          curl -fsSL "${BASE}/${NAME}.tar.xz" -o "${RUNNER_TEMP}/node.tar.xz"
          curl -fsSL "${BASE}/SHASUMS256.txt" -o "${RUNNER_TEMP}/SHASUMS256.txt"
          EXPECTED="$(awk -v name="${NAME}.tar.xz" '$2 == name {print $1}' "${RUNNER_TEMP}/SHASUMS256.txt")"
          test -n "${EXPECTED}"
          echo "${EXPECTED}  ${RUNNER_TEMP}/node.tar.xz" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${RUNNER_TEMP}"
          test -x "${RUNNER_TEMP}/${NAME}/bin/node"
          echo "BUNDLED_NODE_BIN=${RUNNER_TEMP}/${NAME}/bin/node" >> "${GITHUB_ENV}"
          "${RUNNER_TEMP}/${NAME}/bin/node" -v

      - name: Install dependencies
        working-directory: extracted/snapshot-2026-10-03
        run: npm install --no-audit --no-fund --no-package-lock

      - name: TypeScript check
        working-directory: extracted/snapshot-2026-10-03
        run: npm run lint

      - name: Real control-plane smoke
        working-directory: extracted/snapshot-2026-10-03
        env:
          SPLUNK_DOCTOR_BOOTSTRAP_PASSWORD: CI-Smoke-Only-2026!
          SMOKE_PORT: '3100'
        run: npm run smoke

      - name: Build
        working-directory: extracted/snapshot-2026-10-03
        run: npm run build

      - name: Verify standalone package
        working-directory: extracted/snapshot-2026-10-03
        shell: bash
        run: |
          set -euo pipefail
          test -f splunk-doctor-offline-rhel.tar.gz
          test -f splunk-doctor-offline-rhel.tar.gz.sha256
          sha256sum -c splunk-doctor-offline-rhel.tar.gz.sha256
          tar -tzf splunk-doctor-offline-rhel.tar.gz | grep -F 'node-runtime/bin/node'
          tar -tzf splunk-doctor-offline-rhel.tar.gz | grep -F 'dist/server.cjs'
          tar -tzf splunk-doctor-offline-rhel.tar.gz | grep -F 'setup.sh'
          tar -xOzf splunk-doctor-offline-rhel.tar.gz splunk-doctor/systemd/splunk-doctor.service | grep -F 'ExecStart=/opt/splunk-doctor/node-runtime/bin/node /opt/splunk-doctor/dist/server.cjs'
          test "$(tar -xOf splunk-doctor-offline-rhel.tar.gz splunk-doctor/node-runtime/bin/node | wc -c)" -gt 1000000
