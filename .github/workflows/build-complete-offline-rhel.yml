name: Build Complete Offline RHEL Installer

on:
  push:
    branches:
      - main
      - pilot-production-rebuild-20261003
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      APP_ROOT: extracted/snapshot-2026-10-03
      KUBECTL_VERSION: v1.37.1
      VALIDATED_OFFLINE_ARTIFACT_ID: 11295519259

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install application dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-package-lock

      - name: Lint, build, and real smoke
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          npm run lint
          node --check scripts/update-finalizer.cjs
          bash -n scripts/*.sh
          npm run build
          npm run smoke

      - name: Reuse validated offline RHEL media
        id: reuse-offline-media
        working-directory: ${{ env.APP_ROOT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pilot-offline-cache
          mkdir -p /tmp/pilot-offline-cache
          if curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VALIDATED_OFFLINE_ARTIFACT_ID}/zip" \
            -o /tmp/pilot-offline-cache/artifact.zip; then
            unzip -q /tmp/pilot-offline-cache/artifact.zip -d /tmp/pilot-offline-cache/unpacked
            cached_tar="$(find /tmp/pilot-offline-cache/unpacked -type f -name 'splunk-doctor-offline-rhel-1.5.0-complete.tar.gz' -print -quit)"
            if [ -n "${cached_tar}" ]; then
              rm -rf /tmp/pilot-offline-cache/media
              mkdir -p /tmp/pilot-offline-cache/media
              tar -xzf "${cached_tar}" -C /tmp/pilot-offline-cache/media
              if [ -d /tmp/pilot-offline-cache/media/splunk-doctor/offline-prereqs ]; then
                rm -rf offline-prereqs
                cp -a /tmp/pilot-offline-cache/media/splunk-doctor/offline-prereqs offline-prereqs
                echo "hit=true" >> "${GITHUB_OUTPUT}"
                echo "[+] Reused previously validated offline RHEL media."
              else
                echo "hit=false" >> "${GITHUB_OUTPUT}"
                echo "[i] Cached artifact did not contain offline media."
              fi
            else
              echo "hit=false" >> "${GITHUB_OUTPUT}"
              echo "[i] Cached artifact tarball not found; a fresh closure will be built."
            fi
          else
            echo "hit=false" >> "${GITHUB_OUTPUT}"
            echo "[i] Cached artifact unavailable; a fresh closure will be built."
          fi

      - name: Prepare offline media directories
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p offline-prereqs/rhel8/x86_64/rpms
          mkdir -p offline-prereqs/rhel8/x86_64/bin
          mkdir -p offline-prereqs/rhel9/x86_64/rpms
          mkdir -p offline-prereqs/rhel9/x86_64/bin

      - name: Build RHEL 8 offline RPM closure
        if: steps.reuse-offline-media.outputs.hit != 'true'
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          docker pull rockylinux:8
          docker run --rm -e 'PACKAGES=curl openssl openssh-clients iproute iputils gawk sed grep findutils coreutils util-linux hostname which nmap-ncat lsof net-tools conntrack-tools tar gzip ca-certificates firewalld iptables policycoreutils policycoreutils-python-utils python3 rsync procps-ng podman chrony ipmitool' -v "${PWD}/offline-prereqs/rhel8/x86_64/rpms:/out" rockylinux:8 bash -lc 'set -euo pipefail; dnf -y install dnf-plugins-core; dnf download --resolve --alldeps --arch=x86_64,noarch --destdir /out ${PACKAGES}'

      - name: Build RHEL 9 offline RPM closure
        if: steps.reuse-offline-media.outputs.hit != 'true'
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          docker pull rockylinux:9
          docker run --rm -e 'PACKAGES=curl openssl openssh-clients iproute iputils gawk sed grep findutils coreutils util-linux hostname which nmap-ncat lsof net-tools conntrack-tools tar gzip ca-certificates firewalld iptables policycoreutils policycoreutils-python-utils python3 rsync procps-ng podman chrony ipmitool' -v "${PWD}/offline-prereqs/rhel9/x86_64/rpms:/out" rockylinux:9 bash -lc 'set -euo pipefail; dnf -y install dnf-plugins-core; dnf download --resolve --alldeps --arch=x86_64,noarch --destdir /out ${PACKAGES}'

      - name: Persist offline DNF repository metadata
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          for rhel in 8 9; do
            repo_dir="offline-prereqs/rhel${rhel}/x86_64/rpms"
            rm -rf "${repo_dir}/repodata" "${repo_dir}/.repodata"
            docker run --rm \
              -v "${PWD}/${repo_dir}:/out" \
              "rockylinux:${rhel}" \
              bash -lc 'set -euo pipefail; dnf -y install dnf-plugins-core createrepo_c >/dev/null; createrepo_c /out >/tmp/createrepo.log 2>&1; test -f /out/repodata/repomd.xml'
            test -f "${repo_dir}/repodata/repomd.xml"
          done

      - name: Download kubectl and verify checksum
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          for rhel in 8 9; do
            target="offline-prereqs/rhel${rhel}/x86_64/bin"
            curl -fL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "${target}/kubectl"
            curl -fL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" -o "${target}/kubectl.sha256"
            expected="$(tr -d '[:space:]' < "${target}/kubectl.sha256")"
            actual="$(sha256sum "${target}/kubectl" | cut -d' ' -f1)"
            test "${#expected}" -eq 64
            test "${actual}" = "${expected}"
            chmod 0755 "${target}/kubectl"
          done

      - name: Verify offline dependency media
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          test "$(find offline-prereqs/rhel8/x86_64/rpms -maxdepth 1 -type f -name '*.rpm' | wc -l)" -gt 0
          test "$(find offline-prereqs/rhel9/x86_64/rpms -maxdepth 1 -type f -name '*.rpm' | wc -l)" -gt 0
          test -x offline-prereqs/rhel8/x86_64/bin/kubectl
          test -x offline-prereqs/rhel9/x86_64/bin/kubectl
          test -f offline-prereqs/rhel8/x86_64/rpms/repodata/repomd.xml
          test -f offline-prereqs/rhel9/x86_64/rpms/repodata/repomd.xml
          test -f scripts/install-offline-prereqs.sh
          chmod 0755 scripts/install-offline-prereqs.sh

      - name: Assemble complete offline installer
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/splunk-doctor/node-runtime/bin
          cp -a dist scripts setup.sh package.json README.md metadata.json offline-prereqs release/splunk-doctor/
          cp -a node_modules release/splunk-doctor/
          cp "$(command -v node)" release/splunk-doctor/node-runtime/bin/node
          chmod 0755 release/splunk-doctor/node-runtime/bin/node

          # Never ship runtime secrets from the build workspace.
          find release/splunk-doctor -type f \( \
            -name 'security-db.json' -o \
            -name 'master-signing.key' -o \
            -name 'bootstrap-admin-password' \
          \) -delete

          # Explicitly restore executable bits after copy/normalization.
          # Git checkouts may not preserve script mode in all packaging paths.
          find release/splunk-doctor/scripts -type f \( \
            -name '*.sh' -o -name '*.bash' -o -name '*.py' -o -name '*.pl' -o -name '*.rb' \
          \) -exec chmod 0755 {} +
          chmod 0755 release/splunk-doctor/setup.sh

          # Keep non-executable application/config files readable.
          find release/splunk-doctor -type f ! -path 'release/splunk-doctor/scripts/*' \
            ! -name 'setup.sh' ! -path 'release/splunk-doctor/node-runtime/bin/node' \
            -exec chmod 0644 {} +
          chmod 0755 release/splunk-doctor/node-runtime/bin/node

          tar -czf release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz -C release splunk-doctor
          sha256sum release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz > release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz.sha256

      - name: Verify complete archive
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          archive="release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz"
          manifest="release/final-archive-manifest.txt"

          sha256sum -c release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz.sha256
          tar -tzf "${archive}" > "${manifest}"

          grep -Fq 'splunk-doctor/dist/server.cjs' "${manifest}"
          grep -Fq 'splunk-doctor/dist/index.html' "${manifest}"
          grep -Fq 'splunk-doctor/setup.sh' "${manifest}"
          grep -Fq 'splunk-doctor/node-runtime/bin/node' "${manifest}"
          grep -Fq 'splunk-doctor/node_modules/express/' "${manifest}"
          grep -Fq 'splunk-doctor/metadata.json' "${manifest}"
          grep -Fq 'splunk-doctor/package.json' "${manifest}"
          grep -Eq 'splunk-doctor/offline-prereqs/rhel8/x86_64/rpms/[^[:space:]]+\.rpm$' "${manifest}"
          grep -Eq 'splunk-doctor/offline-prereqs/rhel9/x86_64/rpms/[^[:space:]]+\.rpm$' "${manifest}"
          grep -Fq 'splunk-doctor/offline-prereqs/rhel8/x86_64/bin/kubectl' "${manifest}"
          grep -Fq 'splunk-doctor/offline-prereqs/rhel9/x86_64/bin/kubectl' "${manifest}"
          grep -Fq 'splunk-doctor/offline-prereqs/rhel8/x86_64/rpms/repodata/repomd.xml' "${manifest}"
          grep -Fq 'splunk-doctor/offline-prereqs/rhel9/x86_64/rpms/repodata/repomd.xml' "${manifest}"

          if grep -Eq '(security-db\.json|master-signing\.key|bootstrap-admin-password)$' "${manifest}"; then
            echo "Runtime secret leaked into release archive."
            exit 1
          fi

          # Verify executable bits survive the tar archive.
          mkdir -p /tmp/pilot-archive-perms
          rm -rf /tmp/pilot-archive-perms/*
          tar -xzf "${archive}" -C /tmp/pilot-archive-perms
          test -x /tmp/pilot-archive-perms/splunk-doctor/setup.sh
          test -x /tmp/pilot-archive-perms/splunk-doctor/node-runtime/bin/node
          missing_script="$(find /tmp/pilot-archive-perms/splunk-doctor/scripts -type f \(
            -name '*.sh' -o -name '*.bash' -o -name '*.py' -o -name '*.pl' -o -name '*.rb' \)
            ! -perm /111 -print -quit)"
          if [ -n "${missing_script}" ]; then
            echo "Bundled script lost executable bit."
            exit 1
          fi

      - name: Execute complete offline media on Rocky Linux
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          archive="release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz"
          for rhel in 8 9; do
            docker pull "rockylinux:${rhel}"
            docker run --rm --network none \
              -e "RHEL_VERSION=${rhel}" \
              -v "${PWD}/${archive}:/media/app.tar.gz:ro" \
              "rockylinux:${rhel}" \
              bash -lc '
                set -euo pipefail
                rm -rf /work
                mkdir -p /work
                tar -xzf /media/app.tar.gz -C /work
                app=/work/splunk-doctor
                test -f "${app}/node-runtime/bin/node"
                test -f "${app}/setup.sh"
                test -f "${app}/scripts/install-offline-prereqs.sh"
                bash "${app}/scripts/install-offline-prereqs.sh"
                test -x /usr/local/bin/splunk-doctor-node
                /usr/local/bin/splunk-doctor-node --version
                export PATH="/usr/local/bin:${PATH}"
                command -v kubectl >/dev/null
                mkdir -p /tmp/pilot-data
                NODE_ENV=production PORT=3100 SPLUNK_DOCTOR_DATA_DIR=/tmp/pilot-data SPLUNK_HOME=/opt/splunk \
                  /usr/local/bin/splunk-doctor-node "${app}/dist/server.cjs" >/tmp/pilot-server.log 2>&1 &
                pid=$!
                trap "kill $pid 2>/dev/null || true" EXIT
                code=000
                for i in $(seq 1 20); do
                  code="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3100 || true)"
                  [ "${code}" = "200" ] && break
                  sleep 1
                done
                test "${code}" = "200"
                api_code="$(curl -sS -o /tmp/api-body -w "%{http_code}" http://127.0.0.1:3100/api/real/system || true)"
                if [ "${api_code}" != "401" ]; then cat /tmp/pilot-server.log; fi
                test "${api_code}" = "401"
                if command -v podman >/dev/null 2>&1; then podman --version; else echo "[INFO] Rocky Linux ${RHEL_VERSION}: Podman not installed because it is an optional host capability."; fi
                kubectl version --client >/dev/null 2>&1
                echo "[PASS] Rocky Linux ${RHEL_VERSION}: offline media installed, bundled Node executed, kubectl installed, server started, API auth gate responded."
              '
          done

      - name: Upload complete offline installer
        uses: actions/upload-artifact@v6
        with:
          name: pilot-snapshot-2026-10-03-offline-rhel-1.5.1-complete
          path: |
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz
            ${{ env.APP_ROOT }}/release/splunk-doctor-offline-rhel-1.5.1-complete.tar.gz.sha256
          if-no-files-found: error
